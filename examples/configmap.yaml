apiVersion: v1
kind: ConfigMap
metadata:
  name: my-configmap
  namespace: default
  labels:
    app: my-app
    environment: production
  annotations:
    description: "Fully fledged ConfigMap demonstrating all ConfigMap v1 API fields"

# immutable: true blocks all updates to data/binaryData for this object's lifetime
# (delete + recreate to change it). Use for config that should never drift once
# rolled out — kubelet also skips watching immutable ConfigMaps, easing apiserver load.
immutable: false

# ── data ─────────────────────────────────────────────────────────────
# Plain UTF-8 string key: value entries. Keys must be valid DNS subdomain-ish
# names (alphanumeric, '-', '_', '.'). Values are always strings — quote
# numbers/bools if you need them literal.
data:
  database_url: "postgres://db-service:5432/mydb"
  log_level: info
  feature_flags: "beta-ui=true,dark-mode=false"

  # whole files can live as a single multi-line value
  config.yaml: |
    server:
      port: 8080
      timeout: 30s
    logging:
      level: info

  nginx.conf: |
    server {
      listen 80;
      location / {
        proxy_pass http://backend;
      }
    }

# ── binaryData ───────────────────────────────────────────────────────
# base64-encoded bytes for content that isn't valid UTF-8 (certs, images,
# compiled blobs). A given key must appear in only one of data/binaryData.
binaryData:
  icon.png: cGxhY2Vob2xkZXI=              # base64 of "placeholder"

# ── Consumption ──────────────────────────────────────────────────────
# ConfigMaps are never read directly by a Pod spec — they're always
# referenced from a container/volume. Three ways to consume, all shown
# with this ConfigMap's name (my-configmap) in pod.yaml:
#   1. envFrom.configMapRef        — every key becomes an env var (spec.containers[].envFrom)
#   2. env[].valueFrom.configMapKeyRef — a single key becomes one named env var
#   3. volumes[].configMap         — each key becomes a file in the mounted volume
# See pod.yaml for all three in context (search "my-configmap").
