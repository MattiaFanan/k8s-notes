apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fully-fledged-daemonset
  namespace: default
  labels:
    app: my-agent
    environment: production
    tier: infra
  annotations:
    description: "Fully fledged DaemonSet demonstrating all apps/v1 DaemonSet fields"
  finalizers:
    - example.io/my-finalizer

spec:
  # ── Selector ─────────────────────────────────────────────────────
  # Must match spec.template.metadata.labels exactly. Immutable after creation.
  selector:
    matchLabels:
      app: my-agent
    matchExpressions:
      - key: tier
        operator: In                          # In | NotIn | Exists | DoesNotExist
        values: [infra]

  # ── Update strategy ──────────────────────────────────────────────
  updateStrategy:
    type: RollingUpdate                       # RollingUpdate | OnDelete
    rollingUpdate:
      maxUnavailable: 1                       # or "10%" — max pods down at once during rollout
      maxSurge: 0                             # or "10%" — extra pods created before old ones removed (1.21+)
    # type: OnDelete                          # alternative: pods only recreated when manually deleted

  # ── Rollout tuning ───────────────────────────────────────────────
  minReadySeconds: 0                          # seconds a new pod must be Ready before considered available
  revisionHistoryLimit: 10                    # number of old ControllerRevisions retained for rollback

  # ── Pod template ─────────────────────────────────────────────────
  # See pod.yaml for the full per-field Pod reference. Fields below are
  # the ones DaemonSets typically care about (node coverage, host access).
  template:
    metadata:
      labels:
        app: my-agent
        tier: infra
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"

    spec:
      # DaemonSets ignore spec.template.spec.nodeName-style pinning in favor
      # of the scheduler placing one pod per node matching this selector.
      nodeSelector:
        kubernetes.io/os: linux

      # Common: tolerate control-plane / not-ready / unreachable taints so the
      # pod still runs on every node, including masters, during outages.
      tolerations:
        - operator: Exists                    # tolerate all taints (wildcard) — run on every node
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0

      priorityClassName: system-node-critical  # avoid eviction under node pressure

      serviceAccountName: my-agent-sa

      # Common for node-agents (log/metrics collectors, CNI, kube-proxy-style
      # daemons) that need the node's network namespace directly.
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet        # required when hostNetwork: true

      containers:
        - name: agent
          image: my-node-agent:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
              hostPort: 9100
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              add: [SYS_PTRACE]
              drop: [ALL]

      # hostPath mounts of node-local paths — typical for node-level agents.
      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory

      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: registry-credentials
