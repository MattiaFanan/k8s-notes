# ── Opaque secret (stringData) ──────────────────────────────────────
# The default/general-purpose type. No expected key names — arbitrary
# key: value pairs, meaning is up to the consumer.
apiVersion: v1
kind: Secret
metadata:
  name: my-secret
  namespace: default
  labels:
    app: my-app
  annotations:
    description: "Fully fledged Opaque Secret demonstrating stringData"

# immutable: true blocks all updates to data/stringData for this object's
# lifetime (delete + recreate to change it). Reduces accidental drift and
# apiserver watch load, same as ConfigMap.
immutable: false

type: Opaque                                # Opaque | kubernetes.io/service-account-token | kubernetes.io/dockercfg |
                                             # kubernetes.io/dockerconfigjson | kubernetes.io/basic-auth |
                                             # kubernetes.io/ssh-auth | kubernetes.io/tls | bootstrap.kubernetes.io/token

# ── stringData ───────────────────────────────────────────────────────
# Write-only convenience field: plain-text values, base64-encoded by the
# apiserver on write and merged into `data`. Never comes back populated on
# read (data wins on key collision). Use this for hand-authored secrets so
# you don't have to base64 things yourself.
stringData:
  username: admin
  db_password: placeholder-password
  api_key: placeholder-api-key

# ── data ─────────────────────────────────────────────────────────────
# Same content as stringData but pre-base64-encoded — what you get back on
# read, and what tooling/GitOps pipelines usually generate.
# data:
#   username: YWRtaW4=                      # base64 of "admin"

---
# ── kubernetes.io/tls secret (data) ─────────────────────────────────
# Expected keys: tls.crt (cert, PEM), tls.key (private key, PEM). Consumed
# by Ingress controllers, and by the Pod's `secret` volume/tls.crt volume
# item shown in pod.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: my-tls-secret
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: cGxhY2Vob2xkZXI=                 # base64 of "placeholder" — real value is PEM cert
  tls.key: cGxhY2Vob2xkZXI=                 # base64 of "placeholder" — real value is PEM private key

---
# ── Other built-in types (reference only, one example each) ─────────

# kubernetes.io/service-account-token
# Expected keys (populated by the controller, not hand-written):
#   token       — the JWT
#   ca.crt      — cluster CA cert
#   namespace   — namespace the token is scoped to
# Requires annotation kubernetes.io/service-account.name pointing at the SA.
apiVersion: v1
kind: Secret
metadata:
  name: my-sa-token
  annotations:
    kubernetes.io/service-account.name: my-service-account
type: kubernetes.io/service-account-token

---
# kubernetes.io/dockercfg
# Expected key: .dockercfg — legacy Docker config JSON (base64 in data).
# Superseded by dockerconfigjson; still recognized for old client compat.
apiVersion: v1
kind: Secret
metadata:
  name: my-dockercfg-secret
type: kubernetes.io/dockercfg
data:
  .dockercfg: cGxhY2Vob2xkZXI=              # base64 of "placeholder"

---
# kubernetes.io/dockerconfigjson
# Expected key: .dockerconfigjson — full ~/.docker/config.json contents,
# base64-encoded. Reference by name in spec.imagePullSecrets (see pod.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: cGxhY2Vob2xkZXI=       # base64 of "placeholder"

---
# kubernetes.io/basic-auth
# Expected keys: username, password (plain strings, base64'd in data).
apiVersion: v1
kind: Secret
metadata:
  name: my-basic-auth-secret
type: kubernetes.io/basic-auth
data:
  username: cGxhY2Vob2xkZXI=                # base64 of "placeholder"
  password: cGxhY2Vob2xkZXI=                # base64 of "placeholder"

---
# kubernetes.io/ssh-auth
# Expected key: ssh-privatekey — PEM-encoded private key.
apiVersion: v1
kind: Secret
metadata:
  name: my-ssh-auth-secret
type: kubernetes.io/ssh-auth
data:
  ssh-privatekey: cGxhY2Vob2xkZXI=          # base64 of "placeholder"

---
# bootstrap.kubernetes.io/token
# Used for node bootstrap tokens (kubeadm join). Expected keys:
#   token-id, token-secret         — the two token halves
#   expiration                     — RFC3339 timestamp
#   usage-bootstrap-authentication — "true"
#   usage-bootstrap-signing        — "true"
#   auth-extra-groups               — comma-separated extra RBAC groups
# Must live in the kube-system namespace, name prefixed bootstrap-token-<token-id>.
apiVersion: v1
kind: Secret
metadata:
  name: bootstrap-token-abc123
  namespace: kube-system
type: bootstrap.kubernetes.io/token
stringData:
  token-id: abc123
  token-secret: placeholder-token-secret
  expiration: "2026-12-31T23:59:59Z"
  usage-bootstrap-authentication: "true"
  usage-bootstrap-signing: "true"

# ── Consumption ──────────────────────────────────────────────────────
# Same three patterns as ConfigMap — envFrom.secretRef (all keys as env
# vars), env[].valueFrom.secretKeyRef (one key as one env var), and
# volumes[].secret (each key as a mounted file). dockerconfigjson-typed
# secrets are also referenced via spec.imagePullSecrets[].name.
# See pod.yaml for all of these in context (search "my-secret" and
# "registry-credentials").
