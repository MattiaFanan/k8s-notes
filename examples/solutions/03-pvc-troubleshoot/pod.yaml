apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: storage-03
spec:
  containers:
  - name: db
    image: busybox:1.36
    command: ["sh", "-c", "echo started > /data/db.log; sleep 3600"]
    volumeMounts: [{name: data, mountPath: /data}]
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: pvc-db          # was pvc-database: no such claim
