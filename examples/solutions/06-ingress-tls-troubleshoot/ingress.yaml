apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  namespace: ingress-06
spec:
  ingressClassName: traefik
  tls:
  - hosts: [store.ckad.local]   # must match the rule host
    secretName: store-tls       # Secret in the SAME namespace as the Ingress
  rules:
  - host: store.ckad.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: store           # was store-svc
            port: {number: 80}    # was 8080; the Service exposes 80
