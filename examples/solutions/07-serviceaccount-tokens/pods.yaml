apiVersion: v1
kind: Pod
metadata: {name: no-token, namespace: sa-07}
spec:
  serviceAccountName: builder          # inherits automount=false from the SA
  containers:
  - {name: c, image: busybox:1.36, command: [sleep, "3600"]}
---
apiVersion: v1
kind: Pod
metadata: {name: with-token, namespace: sa-07}
spec:
  serviceAccountName: builder
  automountServiceAccountToken: true   # the pod-level setting wins over the SA
  containers:
  - {name: c, image: busybox:1.36, command: [sleep, "3600"]}
---
apiVersion: v1
kind: Pod
metadata: {name: vault-client, namespace: sa-07}
spec:
  serviceAccountName: builder
  containers:
  - name: c
    image: busybox:1.36
    command: [sleep, "3600"]
    volumeMounts:
    - {name: vault-token, mountPath: /var/run/secrets/tokens, readOnly: true}
  volumes:
  - name: vault-token
    projected:
      sources:
      - serviceAccountToken:
          path: vault-token             # file name inside mountPath
          audience: vault
          expirationSeconds: 3600       # minimum 600; the kubelet rotates it before it expires
