apiVersion: v1
kind: ServiceAccount
metadata: {name: monitor, namespace: rbac-11}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole                       # cluster-scoped: no namespace
metadata: {name: node-viewer}
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [persistentvolumes]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: node-viewer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: node-viewer}
subjects:
- {apiGroup: rbac.authorization.k8s.io, kind: Group, name: ops}
- {kind: ServiceAccount, name: monitor, namespace: rbac-11}   # SA subjects have no apiGroup but need a namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: app-config-reader, namespace: rbac-11}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [app-config]           # only this object
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: app-config-reader, namespace: rbac-11}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: app-config-reader}
subjects:
- {kind: ServiceAccount, name: monitor, namespace: rbac-11}
