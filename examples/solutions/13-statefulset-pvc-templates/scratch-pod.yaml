apiVersion: v1
kind: Pod
metadata: {name: scratch, namespace: sts-13}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: [sleep, "3600"]
    volumeMounts:
    - {name: work, mountPath: /scratch}
  volumes:
  - name: work
    ephemeral:                 # a PVC "<pod>-<volume>" is created with the pod and deleted with it
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 16Mi
