apiVersion: v1
kind: Service
metadata: {name: db, namespace: sts-13}
spec:
  clusterIP: None              # headless: DNS gives one record per pod, no virtual IP
  selector: {app: db}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: sts-13}
spec:
  serviceName: db              # gives pods the names db-N.db.sts-13.svc.cluster.local
  replicas: 3
  selector:
    matchLabels: {app: db}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain        # default: keep the PVCs if the StatefulSet is deleted
    whenScaled: Delete         # delete data-db-N for the pods removed by a scale-down
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
      - name: db
        image: busybox:1.36
        command: ["sh", "-c", "hostname > /data/hostname; date >> /data/boots; sleep 3600"]
        volumeMounts:
        - {name: data, mountPath: /data}   # name = the volumeClaimTemplate name; no 'volumes:' entry needed
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: local-path
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 32Mi
