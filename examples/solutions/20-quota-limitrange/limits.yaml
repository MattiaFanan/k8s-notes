apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: quota-20}
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 100m, memory: 64Mi}   # used when a container sets no request
    default: {cpu: 200m, memory: 128Mi}         # used when a container sets no limit
    max: {memory: 256Mi}                        # a bigger limit is rejected
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: team-quota, namespace: quota-20}
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "4"
    count/deployments.apps: "2"
