apiVersion: apps/v1
kind: Deployment
metadata: {name: green, namespace: deploy-22}
spec:
  replicas: 2
  selector: {matchLabels: {app: shop, version: green}}
  template:
    metadata: {labels: {app: shop, version: green}}
    spec:
      containers: [{name: echo, image: "hashicorp/http-echo:1.0", args: ["-text=v2", "-listen=:5678"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-canary, namespace: deploy-22}
spec:
  replicas: 1                  # 1 of 5 pods behind the Service = about 20% of requests
  selector: {matchLabels: {app: catalog, track: canary}}
  template:
    metadata: {labels: {app: catalog, track: canary}}   # app=catalog -> selected by the Service
    spec:
      containers: [{name: echo, image: "hashicorp/http-echo:1.0", args: ["-text=catalog-v2", "-listen=:5678"]}]
