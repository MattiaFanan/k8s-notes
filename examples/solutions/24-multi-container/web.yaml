apiVersion: v1
kind: Pod
metadata: {name: web, namespace: multi-24}
spec:
  initContainers:
  - name: fetch                       # runs to completion BEFORE the others start
    image: busybox:1.36
    command: ["sh", "-c", "echo 'hello from init' > /html/index.html"]
    volumeMounts: [{name: html, mountPath: /html}]
  - name: log-shipper                 # restartPolicy Always = native sidecar: starts in order, keeps running
    image: busybox:1.36
    restartPolicy: Always
    command: ["sh", "-c", "tail -F /logs/access.log"]
    volumeMounts: [{name: logs, mountPath: /logs}]
  containers:
  - name: nginx
    image: nginx:1.27-alpine
    volumeMounts:
    - {name: html, mountPath: /usr/share/nginx/html}
    - {name: logs, mountPath: /var/log/nginx}   # hides the image's symlinks to stdout -> real files
  volumes:
  - {name: html, emptyDir: {}}
  - {name: logs, emptyDir: {}}
---
apiVersion: v1
kind: Pod
metadata: {name: waiter, namespace: multi-24}
spec:
  initContainers:
  - name: wait-for-backend
    image: busybox:1.36
    command: ["sh", "-c", "until nslookup backend.multi-24.svc.cluster.local; do echo waiting; sleep 2; done"]
  containers:
  - {name: main, image: busybox:1.36, command: [sleep, "3600"]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: batch, namespace: multi-24}
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: helper
        image: busybox:1.36
        restartPolicy: Always          # native sidecar: stopped by the kubelet when 'work' is done
        command: [sleep, "3600"]
      containers:
      - name: work
        image: busybox:1.36
        command: ["sh", "-c", "echo working; sleep 5; echo finished"]
