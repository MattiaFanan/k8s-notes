apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.ckad.example.com      # must be <plural>.<group>
spec:
  group: ckad.example.com
  scope: Namespaced
  names:
    kind: Backup
    plural: backups
    singular: backup
    shortNames: [bk]
  versions:
  - name: v1
    served: true                      # available through the API
    storage: true                     # exactly one version is stored in etcd
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [schedule]
            properties:
              schedule: {type: string}
              retention: {type: integer, minimum: 1, maximum: 30}
              target: {type: string}
    additionalPrinterColumns:
    - {name: Schedule, type: string, jsonPath: .spec.schedule}
    - {name: Retention, type: integer, jsonPath: .spec.retention}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
