apiVersion: batch/v1               # was batch/v1beta1 (removed in 1.25); fields unchanged
kind: CronJob
metadata: {name: nightly, namespace: api-26}
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers: [{name: c, image: busybox:1.36, command: [echo, nightly]}]
