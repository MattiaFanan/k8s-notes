apiVersion: autoscaling/v2         # was autoscaling/v2beta1 (removed in 1.25)
kind: HorizontalPodAutoscaler
metadata: {name: web, namespace: api-26}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}   # the target's version changed too
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:                      # was targetAverageUtilization: 50
        type: Utilization
        averageUtilization: 50
