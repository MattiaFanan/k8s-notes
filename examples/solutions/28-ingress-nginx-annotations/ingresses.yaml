apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rewrite
  namespace: ann-28
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2    # $2 = second capture group of the path regex
spec:
  ingressClassName: nginx
  rules:
  - host: ann.ckad.local
    http:
      paths:
      - path: /app(/|$)(.*)
        pathType: ImplementationSpecific   # regex paths are controller-specific
        backend: {service: {name: whoami, port: {number: 80}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure
  namespace: ann-28
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth   # same namespace; key must be "auth"
    nginx.ingress.kubernetes.io/auth-realm: "CKAD only"
spec:
  ingressClassName: nginx
  rules:
  - host: secure.ckad.local
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: main, namespace: ann-28}
spec:
  ingressClassName: nginx
  rules:
  - host: canary.ckad.local
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-canary
  namespace: ann-28
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: X-Canary   # "always" -> canary, "never" -> main
spec:
  ingressClassName: nginx
  rules:
  - host: canary.ckad.local                                  # same host + path as the main Ingress
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: whoami-v2, port: {number: 80}}}}
