apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute                        # owned by the app team, in the app namespace
metadata: {name: store, namespace: gw-29}
spec:
  parentRefs:
  - {name: web-gw, namespace: gateway-system, sectionName: http}
  hostnames: [store.ckad.local]
  rules:
  - matches:                           # the most specific match wins: header rule before the plain "/" rule
    - headers: [{name: X-Version, value: v2}]
    backendRefs: [{name: store-v2, port: 80}]
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - {name: store-v1, port: 80, weight: 80}
    - {name: store-v2, port: 80, weight: 20}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: admin, namespace: gw-29}
spec:
  parentRefs:
  - {name: web-gw, namespace: gateway-system}
  hostnames: [admin.ckad.local]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /admin}
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add: [{name: X-Served-By, value: gateway-api}]
    backendRefs: [{name: admin, port: 80}]
