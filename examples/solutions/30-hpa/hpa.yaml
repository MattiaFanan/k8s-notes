apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: hpa-30}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 50}   # % of the pod's cpu *request*
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60     # default 300
    scaleUp:
      policies:
      - {type: Pods, value: 2, periodSeconds: 15}
