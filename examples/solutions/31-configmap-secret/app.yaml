apiVersion: v1
kind: Pod
metadata: {name: app, namespace: config-31}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    env:
    - name: MODE
      valueFrom: {configMapKeyRef: {name: app-config, key: APP_MODE}}
    - name: FEATURE
      valueFrom: {configMapKeyRef: {name: feature-flags, key: NEW_UI, optional: true}}   # without optional: CreateContainerConfigError
    envFrom:
    - secretRef: {name: db-creds}        # every key becomes an env var (add prefix: X_ to rename)
    volumeMounts:
    - {name: config, mountPath: /etc/config}
    - {name: secret, mountPath: /etc/secret, readOnly: true}
  volumes:
  - name: config
    configMap:
      name: app-config
      items: [{key: app.properties, path: app.properties}]   # only this key; without items every key is a file
  - name: secret
    secret: {secretName: db-creds, defaultMode: 0400}        # octal in YAML; stored as 256
