apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fully-fledged-statefulset
  namespace: default
  labels:
    app: my-db
    environment: production
    tier: data
  annotations:
    description: "Fully fledged StatefulSet demonstrating all apps/v1 StatefulSet fields"

spec:
  # ── Identity ─────────────────────────────────────────────────────
  serviceName: my-db-headless           # must name a Service (usually headless, clusterIP: None)
                                         # that governs network identity: <pod-name>.<serviceName>.<ns>.svc.cluster.local
  replicas: 3

  selector:
    matchLabels:
      app: my-db                        # must match spec.template.metadata.labels exactly

  # ── Pod management ───────────────────────────────────────────────
  podManagementPolicy: OrderedReady     # OrderedReady | Parallel
                                         # OrderedReady: pods created/terminated one at a time, in order (0,1,2,...)
                                         # Parallel: all pods launched/terminated concurrently, no ordering guarantees

  # ── Update strategy ──────────────────────────────────────────────
  updateStrategy:
    type: RollingUpdate                 # RollingUpdate | OnDelete
    rollingUpdate:
      partition: 0                      # ordinals >= partition get updated; ordinals < partition are left alone
                                         # (staged/canary rollouts: raise partition, roll a few, then lower it)
      maxUnavailable: 1                 # or percentage e.g. "10%"; requires podManagementPolicy: Parallel semantics
                                         # to actually take pods down out of order (alpha/beta gate dependent)
  # OnDelete alternative — no automatic rollout; pods are only recreated
  # with the new template when manually deleted:
  # updateStrategy:
  #   type: OnDelete

  revisionHistoryLimit: 10              # number of old ControllerRevisions retained for rollback
  minReadySeconds: 0                    # seconds a new pod must be Ready before it's considered available

  # ── PVC retention policy ─────────────────────────────────────────
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain                 # Retain | Delete — behavior when the StatefulSet itself is deleted
    whenScaled: Delete                  # Retain | Delete — behavior when replicas is scaled down

  # ── Volume claim templates ───────────────────────────────────────
  volumeClaimTemplates:
    - metadata:
        name: data                      # combined with pod name -> data-<statefulset>-<ordinal>
        labels:
          app: my-db
        annotations:
          volume.beta.kubernetes.io/storage-class: fast-ssd
      spec:
        accessModes:
          - ReadWriteOnce                # ReadWriteOnce | ReadOnlyMany | ReadWriteMany | ReadWriteOncePod
        storageClassName: fast-ssd
        volumeMode: Filesystem           # Filesystem | Block
        resources:
          requests:
            storage: 10Gi
          limits:
            storage: 20Gi
        selector:                        # optional — bind to a pre-provisioned PV matching these labels
          matchLabels:
            type: ssd

    - metadata:
        name: wal                        # a second template mounts a second PVC per pod (e.g. write-ahead log)
        labels:
          app: my-db
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 5Gi

  # ── Pod template ─────────────────────────────────────────────────
  # Full field-by-field reference for everything under here (scheduling,
  # affinity, security contexts, volumes, probes, lifecycle hooks, etc.)
  # lives in pod.yaml — this is a realistic StatefulSet pod, not a
  # re-documentation of every Pod field.
  template:
    metadata:
      labels:
        app: my-db                       # must match spec.selector.matchLabels
        tier: data
      annotations:
        prometheus.io/scrape: "true"
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: my-db-service-account

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: my-db
              topologyKey: kubernetes.io/hostname   # one replica per node

      securityContext:
        runAsUser: 999
        runAsNonRoot: true
        fsGroup: 999

      containers:
        - name: db
          image: my-db:5.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: db
              containerPort: 5432
              protocol: TCP
            - name: peer
              containerPort: 7000
              protocol: TCP

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REPLICA_ORDINAL
              value: "$(POD_NAME##*-)"    # derive ordinal from pod name, e.g. my-db-0 -> 0

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi

          volumeMounts:
            - name: data
              mountPath: /var/lib/mydb/data
            - name: wal
              mountPath: /var/lib/mydb/wal

          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20

      # volumes not covered by volumeClaimTemplates (e.g. config) go here,
      # same as any Pod — see pod.yaml's "Volumes" section for every source type
      volumes:
        - name: config
          configMap:
            name: my-db-config
